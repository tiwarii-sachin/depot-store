name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKERHUB_REPO: tiwariisachin/depot-store
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ---------------------------------------------------------
  # Job 1: Lint + Build the frontend (runs on every PR + push)
  # ---------------------------------------------------------
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ---------------------------------------------------------
  # Job 2: Docker build + Trivy security scan (the gate)
  # ---------------------------------------------------------
  docker-scan:
    needs: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ env.DOCKERHUB_REPO }}:${{ env.IMAGE_TAG }} .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.DOCKERHUB_REPO }}:${{ env.IMAGE_TAG }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

  # ---------------------------------------------------------
  # Job 3: Push to Docker Hub (only on main branch, only if scan passed)
  # ---------------------------------------------------------
  push-to-dockerhub:
    needs: docker-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build, tag, and push image to Docker Hub
        run: |
          docker build -t ${{ env.DOCKERHUB_REPO }}:${{ env.IMAGE_TAG }} -t ${{ env.DOCKERHUB_REPO }}:latest .
          docker push ${{ env.DOCKERHUB_REPO }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.DOCKERHUB_REPO }}:latest

      - name: Print pushed image
        run: echo "Pushed image ${{ env.DOCKERHUB_REPO }}:${{ env.IMAGE_TAG }}"